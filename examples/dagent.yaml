host: 127.0.0.1
port: 8000
dataDirectory: ./.dagent-ts
runtimeDirectory: .runtime

provider:
  baseURL: https://api.openai.com/v1
  model: gpt-5-mini
  apiKeyEnv: OPENAI_API_KEY
  timeoutMs: 60000
  streamIncludeUsage: false
  contextWindowTokens: 128000
  outputReserveTokens: 8192
  extraRequestArgs: {}
  extraBody: {}

sandbox:
  enabled: false

skillRoots:
  - ./skills

profiles:
  directory: ./profiles

validation:
  enabled: false
  maxRetries: 1
  profile: validator_agent

mcpServers: []
capabilityModules: []
